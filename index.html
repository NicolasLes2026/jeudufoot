<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quel est ce joueur ?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#17502f; --pitch-dark:#0f3a22; --chalk:#f3f6ee; --line:rgba(243,246,238,.28);
  --ok:#3ddc84; --ko:#ff5d4d; --card:#f3f6ee; --ink:#12241a; --muted:#5d6f63; --gold:#f2c230;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat,
    radial-gradient(circle at 50% 50%,transparent 0 90px,var(--line) 90px 92px,transparent 92px),
    repeating-linear-gradient(90deg,var(--pitch) 0 80px,var(--pitch-dark) 80px 160px);
  color:var(--chalk); padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  display:flex; justify-content:center;
}
main{width:100%;max-width:560px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;margin:0;letter-spacing:-.02em}
.score{text-align:right;white-space:nowrap;position:relative}
.pts{font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.pts small{font-size:.9rem;font-weight:600;opacity:.85;margin-left:3px}
.sub{font-size:.85rem;opacity:.85;margin-top:2px}
.gain{position:absolute;right:0;top:-6px;color:var(--ok);font-weight:800;font-size:1.1rem;opacity:0;pointer-events:none}
.gain.go{animation:floatup 1.1s ease-out}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.card{
  background:var(--card);color:var(--ink);border-radius:18px;padding:22px 20px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35); position:relative; overflow:hidden;
}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0}
.card.good{animation:pop .5s ease}
.card.good::after{background:var(--ok);animation:flash .9s ease}
.card.bad{animation:shake .5s ease}
.card.bad::after{background:var(--ko);animation:flash .9s ease}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hint{margin:0 0 14px;color:var(--muted);font-size:.95rem}
ol.clubs{list-style:none;margin:0 0 20px;padding:0}
ol.clubs li{
  position:relative;padding:9px 0 9px 34px;font-weight:600;font-size:1.08rem;
  opacity:0;transform:translateX(-8px);animation:in .35s ease forwards;
}
ol.clubs li::before{content:"";position:absolute;left:7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--pitch);border:3px solid var(--card);box-shadow:0 0 0 2px var(--pitch)}
ol.clubs li::after{content:"";position:absolute;left:13px;top:calc(50% + 9px);height:100%;width:2px;background:var(--pitch);opacity:.35}
ol.clubs li:last-child::after{display:none}
ol.clubs li.loan::before{background:var(--card);box-shadow:0 0 0 2px var(--gold)}
ol.clubs li.loan::after{background:repeating-linear-gradient(var(--gold) 0 4px,transparent 4px 8px);opacity:1}
.tag{font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px}
@keyframes in{to{opacity:1;transform:none}}
form{display:flex;gap:8px}
input{
  flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;
  border:2px solid #c5d0c8;background:#fff;color:var(--ink);
}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{
  font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;
  background:var(--pitch);color:var(--chalk);transition:transform .1s ease,background .2s;
}
button:hover{background:var(--pitch-dark)}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--muted);padding:8px 4px;font-weight:400;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.result{display:none;margin-top:4px}
.result.show{display:block}
.verdict{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.verdict.ok{color:#14803f}.verdict.ko{color:#c02d1f}
.answer{margin:0 0 14px;font-size:1.05rem}
.answer a{color:var(--pitch);font-weight:600}
.next{width:100%;background:var(--gold);color:var(--ink);font-size:1.05rem}
.next:hover{background:#e2b320}
.start{width:100%;font-size:1.1rem;padding:15px}
.msg{margin:0;color:var(--muted)}
.hidden{display:none!important}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Quel est ce joueur ?</h1>
    <div class="score" aria-live="polite">
      <div class="pts"><span id="pts">0</span><small>pts</small></div>
      <div class="sub" id="sub"></div>
      <span class="gain" id="gain"></span>
    </div>
  </header>

  <section class="card" id="card">
    <p class="msg" id="intro">Je te montre les clubs d’un joueur, dans l’ordre de sa carrière. À toi de trouver qui c’est.</p>
    <p class="msg hidden" id="error"></p>

    <div id="game" class="hidden">
      <p class="hint" id="hint"></p>
      <ol class="clubs" id="clubs"></ol>
      <form id="form" autocomplete="off">
        <input id="guess" type="text" placeholder="Nom du joueur" aria-label="Nom du joueur" autocapitalize="words" spellcheck="false">
        <button type="submit">Valider</button>
      </form>
      <div class="row"><button type="button" class="ghost" id="giveup">Je ne sais pas</button></div>
    </div>

    <div class="result" id="result">
      <p class="verdict" id="verdict"></p>
      <p class="answer" id="answer"></p>
    </div>

    <button type="button" class="start" id="next">Commencer</button>
  </section>
</main>
<canvas id="fx"></canvas>

<script>
(function(){
  "use strict";
  var players=[], deck=[], current=null, answered=false, good=0, total=0, streak=0, points=0, best=0, shown=0;
  try{best=parseInt(localStorage.getItem("foot-best"),10)||0}catch(e){}
  var $=function(id){return document.getElementById(id)};
  var card=$("card"), clubsEl=$("clubs"), guess=$("guess");

  // --- Données -----------------------------------------------------------
  fetch("players.json").then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    players=data.filter(function(p){return p.clubs&&p.clubs.length>=2});
    if(!players.length) throw new Error("vide");
    renderSub(players.length+" joueurs");
  }).catch(function(){
    $("intro").classList.add("hidden");
    $("next").classList.add("hidden");
    var e=$("error"); e.classList.remove("hidden");
    e.textContent="Impossible de charger players.json. Vérifie qu’il est dans le même dossier que index.html. En local, ouvre le jeu via un petit serveur (python -m http.server) plutôt qu’en double-cliquant le fichier.";
  });

  // --- Points ------------------------------------------------------------
  // 10 points par bonne réponse + 5 de bonus par réponse d'affilée (bonus max : 25)
  function gainFor(s){return 10+Math.min(25,5*(s-1))}
  function renderSub(extra){
    var parts=[];
    if(extra) parts.push(extra);
    if(best) parts.push("record "+best);
    $("sub").textContent=parts.join(" · ");
  }
  function countTo(target){
    var from=shown, t0=performance.now(), dur=600;
    (function step(now){
      var k=Math.min(1,(now-t0)/dur);
      shown=Math.round(from+(target-from)*k);
      $("pts").textContent=shown;
      if(k<1) requestAnimationFrame(step);
    })(t0);
  }

  // --- Tirage sans répétition -------------------------------------------
  function refill(){
    deck=players.map(function(_,i){return i});
    for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t}
  }
  function draw(){
    if(!deck.length) refill();
    return players[deck.pop()];
  }

  // --- Comparaison tolérante --------------------------------------------
  function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
  function lev(a,b){
    var m=a.length,n=b.length,d=[],i,j;
    for(i=0;i<=m;i++){d[i]=[i]}
    for(j=1;j<=n;j++){d[0][j]=j}
    for(i=1;i<=m;i++)for(j=1;j<=n;j++){
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    }
    return d[m][n];
  }
  function isCorrect(input,answers){
    var n=norm(input); if(n.length<2) return false;
    return answers.some(function(a){
      var na=norm(a); if(!na) return false;
      var tol=na.length>=9?2:(na.length>=5?1:0);
      return n===na||lev(n,na)<=tol;
    });
  }

  // --- Affichage ---------------------------------------------------------
  function show(p){
    current=p; answered=false;
    card.className="card";
    $("intro").classList.add("hidden");
    $("result").classList.remove("show");
    $("game").classList.remove("hidden");
    $("next").classList.add("hidden");
    $("hint").textContent=p.clubs.length+" clubs, du plus ancien au plus récent.";
    clubsEl.innerHTML="";
    p.clubs.forEach(function(c,i){
      var li=document.createElement("li");
      li.style.animationDelay=(i*90)+"ms";
      if(c.loan) li.className="loan";
      li.appendChild(document.createTextNode(c.name));
      if(c.loan){var t=document.createElement("span");t.className="tag";t.textContent="prêt";li.appendChild(t)}
      clubsEl.appendChild(li);
    });
    guess.value=""; guess.disabled=false; guess.focus({preventScroll:true});
  }

  function finish(ok,gaveUp){
    if(answered||!current) return;
    answered=true; total++;
    var gain=0;
    if(ok){good++;streak++;gain=gainFor(streak);points+=gain}else{streak=0}
    card.className="card "+(ok?"good":"bad");
    $("game").classList.add("hidden");
    var v=$("verdict");
    v.className="verdict "+(ok?"ok":"ko");
    v.textContent=ok?"Bien joué ! +"+gain+" pts":(gaveUp?"Pas de souci.":"Raté !");
    var a=$("answer"); a.textContent="C’était ";
    var strong=document.createElement("strong"); strong.textContent=current.name; a.appendChild(strong);
    if(current.wiki){
      a.appendChild(document.createTextNode(". "));
      var l=document.createElement("a"); l.href=current.wiki; l.target="_blank"; l.rel="noopener"; l.textContent="Voir sa fiche";
      a.appendChild(l);
    }
    $("result").classList.add("show");
    var nx=$("next"); nx.textContent="Joueur suivant"; nx.className="start next"; nx.focus({preventScroll:true});
    if(points>best){best=points;try{localStorage.setItem("foot-best",String(best))}catch(e){}}
    renderSub(good+"/"+total+(streak>1?" · série de "+streak:""));
    countTo(points);
    if(gain){var g=$("gain");g.textContent="+"+gain;g.classList.remove("go");void g.offsetWidth;g.classList.add("go")}
    if(ok) confetti();
  }

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    if(!guess.value.trim()) return;
    finish(isCorrect(guess.value,current.answers||[current.name]),false);
  });
  $("giveup").addEventListener("click",function(){finish(false,true)});
  $("next").addEventListener("click",function(){
    if(!players.length) return;
    show(draw());
  });

  // --- Confettis ---------------------------------------------------------
  var cv=$("fx"), ctx=cv.getContext("2d");
  function confetti(){
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    cv.width=innerWidth; cv.height=innerHeight;
    var colors=["#3ddc84","#f2c230","#f3f6ee","#ff8a3d","#5ec8ff"], ps=[], i;
    for(i=0;i<110;i++) ps.push({
      x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*.45,
      vx:(Math.random()-.5)*12, vy:-Math.random()*13-3, s:5+Math.random()*6,
      r:Math.random()*6, vr:(Math.random()-.5)*.4, c:colors[i%colors.length]
    });
    var t0=performance.now();
    (function tick(now){
      var k=now-t0; ctx.clearRect(0,0,cv.width,cv.height);
      ps.forEach(function(p){
        p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.globalAlpha=Math.max(0,1-k/1800); ctx.fillStyle=p.c;
        ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); ctx.restore();
      });
      if(k<1800) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
    })(t0);
  }
})();
</script>
</body>
</html>
